[project]
name = "find-coffee"
version = "0.1.0"
description = ""
readme = "README.md"
authors = [{ name = "KK-Huang86", email = "iankk0806@gmail.com" }]
requires-python = ">=3.13"

# 生產需求
dependencies = [
    "django~=6.0.1",
    "line-bot-sdk~=3.21.0",
    "python-dotenv~=1.2.1",
    "certifi~=2026.1.4",
    "psycopg2-binary~=2.9.11",
    "python-decouple~=3.8",
    "redis~=7.1.0",
    "celery~=5.6.2",
    "boto3~=1.42.30",
    "gunicorn~=23.0.0",
    "playwright>=1.58.0",
    "groq>=1.4.0",
    "jieba>=0.42.1",
]

# 測試開發需求
[dependency-groups]
dev = [
    "pre-commit~=4.5.1",
    "ruff~=0.14.13",
    "factory-boy~=3.3.3",
    "pytest~=9.0.2",
    "pytest-cov~=6.1.0",
    "pytest-django~=4.11.1",
    "pytest-mock~=3.15.1",
]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.test_settings"
python_files = ["test_*.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cafe", "line_bot", "users", "integrations", "core", "utils"]
